[project]
name = "cognicode"
version = "0.1.0"
description = "AI 技术债识别工具（cognicode-debt skill 的宿主仓库；pyproject 仅承载 dev 环境）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=1.15.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# CLI 已退役（#62）：src/ 评分形态残余删除，仓库收敛为
# cognicode-debt/（可分发的 skill 目录，自包含）+ docs/ + CONTEXT.md。
# 本项目不再构建/安装任何 Python 包——pyproject 只为 uv dev 环境
#（pytest 与 tree-sitter）服务。
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["cognicode-debt/scripts/tests"]
